[package]
name = "conquest-of-sol"
version = "0.0.1"
description = "Conquest of Sol"
edition = "2021"

[lib]
name = "conquest_of_sol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
